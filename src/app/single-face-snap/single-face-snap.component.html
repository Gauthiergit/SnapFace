<div class="face-snap-card" [ngClass]="{snapped: isSnap}">
	<button routerLink="/facesnaps">Back to the snap list</button>
	<h2> {{ faceSnap.title | uppercase}}</h2>
	@if (faceSnap.location){
	<p>Location: {{faceSnap.location}}</p>
	}
	<img [src]="faceSnap.imageUrl" [alt]="faceSnap.title">
	<p> {{ faceSnap.description }} </p>
	<p> Snapshot created at {{ faceSnap.createdAt | date: 'short'}}</p>
	<p>
		<button (click)="onClickSnap()">{{textButton}}</button>
		<span [ngStyle]="{color: 'rgb(0, ' + faceSnap.snaps + ', 0)'}">snaps: {{faceSnap.snaps}}</span>
	</p>
</div>
